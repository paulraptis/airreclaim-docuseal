services:
  app:
    image: ${AIRRECLAIM_DOCUSEAL_IMAGE:?Set AIRRECLAIM_DOCUSEAL_IMAGE to an immutable registry digest}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./docuseal:/data/docuseal
    environment:
      HOST: ${DOCUSEAL_HOST:-sign.airreclaim.com}
      FORCE_SSL: "true"
      AIRRECLAIM_WEBSITE_URL: https://airreclaim.com
      AIRRECLAIM_LOGO_URL: https://airreclaim.com/brand/airreclaim-logo.webp
      AIRRECLAIM_SUPPORT_EMAIL: claims@airreclaim.com
      AIRRECLAIM_DOCUSEAL_SOURCE_URL: https://sign.airreclaim.com/source/airreclaim-docuseal-3.1.2-ar.5.tar.gz
      CERTS:
      TIMESERVER_URL:
      TRUSTED_CERTS:
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 900m

  caddy:
    image: ${AIRRECLAIM_CADDY_IMAGE:-caddy:2.10.0-alpine}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv/airreclaim-docuseal-public:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
